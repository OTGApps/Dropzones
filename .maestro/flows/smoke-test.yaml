# flow: Smoke Test
# intent: Global smoke test that walks the entire app end to end - every menu
# item on the welcome screen, into a detail screen and back, the map tab, and
# the about screen. Not exhaustive assertions, just "does every screen load
# and navigate without crashing."
appId: ${MAESTRO_APP_ID}
onFlowStart:
  - runFlow: ../shared/_OnFlowStart.yaml
---
- assertVisible: "Find Dropzones"

# --- Near Me ---
- tapOn:
    id: "menu-item-near-me"
- runFlow:
    when:
      visible: "While using the app"
    commands:
      - tapOn: "While using the app"
- waitForAnimationToEnd
- back

# --- Alphabetical -> dropzone detail ---
- assertVisible: "Find Dropzones"
- tapOn:
    id: "menu-item-alphabetical"
- assertVisible:
    id: "alphabetical-search-input"
- scroll
- tapOn:
    id: "dropzone-item-.*"
    index: 0
- waitForAnimationToEnd
- back
- back

# --- By State -> list-detail -> dropzone detail ---
- assertVisible: "Find Dropzones"
- tapOn:
    id: "menu-item-by-state"
- scroll
- back

# --- Aircraft Type (SectionList with warning card + search) ---
- assertVisible: "Find Dropzones"
- tapOn:
    id: "menu-item-by-aircraft"
- assertVisible:
    id: "aircraft-search-input"
- scroll
- back

# --- Services Offered ---
- assertVisible: "Find Dropzones"
- tapOn:
    id: "menu-item-by-services"
- scroll
- back

# --- Training Capibilities ---
- assertVisible: "Find Dropzones"
- tapOn:
    id: "menu-item-by-training"
- scroll
- back

# --- About screen ---
- assertVisible: "Find Dropzones"
- tapOn:
    id: "header-about-button"
- assertVisible: "USPA Dropzone Finder"
- back

# --- Map tab ---
- assertVisible: "Find Dropzones"
- tapOn: "Map"
- waitForAnimationToEnd
- tapOn: "Dropzones"
- assertVisible: "Find Dropzones"
