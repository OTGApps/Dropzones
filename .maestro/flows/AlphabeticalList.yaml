# flow: Alphabetical List
# intent:
#   Navigate to the alphabetical list, verify dropzones load by scrolling to 'B',
#   test search functionality, and navigate all the way into a dropzone detail screen.

appId: ${MAESTRO_APP_ID}
onFlowStart:
  - runFlow: ../shared/_OnFlowStart.yaml
---
- assertVisible: "Find Dropzones"
- tapOn: "Alphabetical"
- assertVisible: "Alphabetical"
- waitForAnimationToEnd

# Search bar should be visible
- assertVisible: "Search Dropzones..."

# Scroll a short distance to verify the list has items — B section is just past A
- scrollUntilVisible:
    element:
      text: "Bay Area Skydiving"
    direction: DOWN
    timeout: 10000
    speed: 60

- assertVisible: "Bay Area Skydiving"

# Test search — type a query and verify results filter
- tapOn: "Search Dropzones..."
- inputText: "Skydive Perris"
- waitForAnimationToEnd
- assertVisible: "Skydive Perris"

# Clear search and verify list returns
- eraseText: 100
- waitForAnimationToEnd

# Search for Jumptown, assert the correct result appears, then tap it
- tapOn: "Search Dropzones..."
- inputText: "Jumptown"
- waitForAnimationToEnd
- assertVisible: "Jumptown"
- tapOn: "Jumptown"
- waitForAnimationToEnd

# Disclaimer shows on first visit — wait for the 500ms delay then conditionally dismiss
- runFlow:
    when:
      visible: "Got it!"
    commands:
      - tapOn: "Got it!"
      - waitForAnimationToEnd

# Detail screen — bottom sheet should show DZ name and website
- assertVisible: "Jumptown"
- assertVisible: "jumptown.com"
