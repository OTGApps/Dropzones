# flow: By Services
# intent:
#   Navigate the By Services Offered screen, verify services are listed, drill into
#   a service's dropzone list, and navigate all the way to a dropzone detail screen.

appId: ${MAESTRO_APP_ID}
onFlowStart:
  - runFlow: ../shared/_OnFlowStart.yaml
---
- assertVisible: "Find Dropzones"
- tapOn: "Services Offered"
- assertVisible: "By Services Offered"
- waitForAnimationToEnd

# Common services should be visible
- assertVisible: "Rigging"

# Tap into a service to see DZs that offer it
- tapOn: "Rigging"
- waitForAnimationToEnd

# The filtered dropzone list should load with a search bar
- assertVisible: "Search Dropzones..."

# Search for a known Rigging DZ, assert the correct result appears, then tap it
- tapOn: "Search Dropzones..."
- inputText: "Jumptown"
- waitForAnimationToEnd
- assertVisible: "Jumptown"
- tapOn: "Jumptown"
- waitForAnimationToEnd

# Disclaimer shows on first visit — wait for the 500ms delay then conditionally dismiss
- runFlow:
    when:
      visible: "Got it!"
    commands:
      - tapOn: "Got it!"
      - waitForAnimationToEnd

# Detail screen — bottom sheet should show DZ name and website
- assertVisible: "Jumptown"
- assertVisible: "jumptown.com"
