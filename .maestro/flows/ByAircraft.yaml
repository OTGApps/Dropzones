# flow: By Aircraft
# intent:
#   Navigate the By Aircraft screen, dismiss the data warning card, verify aircraft
#   types are listed, drill into a type's dropzone list, and navigate to a detail screen.

appId: ${MAESTRO_APP_ID}
onFlowStart:
  - runFlow: ../shared/_OnFlowStart.yaml
---
- assertVisible: "Find Dropzones"
- tapOn: "Aircraft Type"
- assertVisible: "By Aircraft"
- waitForAnimationToEnd

# The data warning card appears on first visit — dismiss it
- runFlow:
    when:
      visible: "DATA WARNING:"
    commands:
      - tapOn: "OK"
      - waitForAnimationToEnd

# Aircraft list should be present with a search bar
- assertVisible: "Search Aircraft..."

# Cessna 182 is the most common aircraft at DZs — scroll until visible
- scrollUntilVisible:
    element:
      text: "Cessna 182"
    direction: DOWN
    timeout: 10000
    speed: 40

- assertVisible: "Cessna 182"

# Tap into the dropzone list for Cessna 182
- tapOn: "Cessna 182"
- waitForAnimationToEnd

# The filtered dropzone list should load with a search bar
- assertVisible: "Search Dropzones..."

# Search for a known Cessna 182 DZ, assert the correct result appears, then tap it
- tapOn: "Search Dropzones..."
- inputText: "Skydive Chicago"
- waitForAnimationToEnd
- assertVisible: "Skydive Chicago, Inc."
- tapOn: "Skydive Chicago"
- waitForAnimationToEnd

# Disclaimer shows on first visit — wait for the 500ms delay then conditionally dismiss
- runFlow:
    when:
      visible: "Got it!"
    commands:
      - tapOn: "Got it!"
      - waitForAnimationToEnd

# Detail screen — bottom sheet should show DZ name and website
- assertVisible: "Skydive Chicago"
- assertVisible: "skydivechicago.com"
