#flow: Shared _Back
#intent: Navigate back one screen, cross-platform. Maestro's `back` command
# only works on Android (it drives the hardware/software back action); iOS
# has no equivalent, so there we tap the native stack header's back button.
# UIKit exposes it with the accessibility id `BackButton`.
appId: ${MAESTRO_APP_ID}
---
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: "BackButton"
