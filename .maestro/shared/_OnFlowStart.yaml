# flow: Shared _OnFlowStart
#intent:
# launch the app with a completely clear state, wait for animations to settle,
# and click through the expo dev screens if needed.
# These conditionals slow the app launch down a little but are necessary because the expo
# dev server and launch screen are only shown when the new architecture is turned off in expo 53.
# So we check to see if we need to connect to the metro server... that loads the app and then we
# check if the dev menu is showing and dismiss it if necessary.
# Then the app is then launched and ready for the maestro tests to run.
#
# Pass env METRO_URL to point the dev client at a Metro server other than http://localhost:8081.
#
# Maestro grants every permission on launch by default. Pass env LOCATION_PERMISSION
# to override location. `unset` makes the OS prompt appear and works on both platforms.
# Other values are platform-specific: iOS takes `always`, `inuse` or `never`; Android
# takes `allow` or `deny`. The default is `inuse` on iOS and `allow` on Android.
#
# This flow should be included in every maestro test header as `onFlowStart` to ensure expo screens
# are bypassed if necessary. Example:
#
# appId: ${MAESTRO_APP_ID}
# onFlowStart:
#   - runFlow: ../shared/_OnFlowStart.yaml
# ---
# [your maestro flow]
#
appId: ${MAESTRO_APP_ID}
env:
  METRO_URL: '${METRO_URL || "http://localhost:8081"}'
  LOCATION_PERMISSION: '${LOCATION_PERMISSION || (maestro.platform == "ios" ? "inuse" : "allow")}'
---
# launch the app with a clean slate
- launchApp:
    clearState: true
    clearKeychain: true
    stopApp: true
    permissions:
      location: ${LOCATION_PERMISSION}

- waitForAnimationToEnd

# conditionally connect the dev client to Metro if the words "Development servers" are present.
# clearState wipes the launcher's server history and the simulator does not reliably discover
# Metro, so open the dev client deep link directly instead of tapping a discovered server.
# The deep link flags hide the dev client's floating menu button, which otherwise covers the
# header's top-right button, and skip the one-time onboarding sheet.
# this uses the default maestro timeout and moves on if it doesn't see the text.
- runFlow:
    when:
      visible: 'Development servers'
    commands:
      - openLink: "exp+dropzones://?__expo_url=${encodeURIComponent(METRO_URL)}&__expo_disable_fab=1&__expo_disable_onboarding=1"
      - waitForAnimationToEnd

# the one-time dev menu intro sheet covers the app after first connect; dismiss it if shown.
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
      - waitForAnimationToEnd

# the dev menu sheet (Reload, Go home, Tools) opens over the app after Continue; close it if shown.
- runFlow:
    when:
      visible: "Go home"
    commands:
      - tapOn: "Close"
      - waitForAnimationToEnd
